<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GIA STORE</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>


    <div class="login-container">

        <div class="login-left">
            <img src="image/logo.png" alt="Logo GIA STORE">
            <h1>GIA STORE</h1>
            <p>Tunjukkan Gayamu Disini!</p>
        </div>

        <div class="login-right">

            <div class="login-box">

                <h2>Selamat Datang</h2>
                <p>Silakan login terlebih dahulu</p>

                <div class="role-box">
                    <button class="role-btn active" onclick="pilihRole('pembeli',this)">
                        👤 Pembeli
                    </button>

                    <button class="role-btn" onclick="pilihRole('admin',this)">
                        👨‍💼 Admin
                    </button>
                </div>

                <input type="text" id="username" placeholder="Username">

                <input type="password" id="password" placeholder="Password">

                <button class="login-btn" onclick="login()">
                    Login
                </button>


                <p style="text-align:center;margin-top:18px;">
    Belum punya akun?
    <a href="register.html">Daftar Sekarang</a>
</p>

            </div>

        </div>

    </div>

<script src="js/login.js"></script>
<script src="js/main.js"></script>

</body>
</html>
